<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a single centred column of light panels floating over a deep-ocean VR gradient with a perspective grid floor; the lab map is a honeycomb of hexagonal portals (echoing the STEM Jobs hexagon). Single deliberate look in both OS themes. */
:root {
  --abyss: #041530;
  --deep: #0a2c6b;
  --ocean: #0b5cad;
  --sky: #1aa6e4;
  --ice: #eaf5fd;
  --paper: #ffffff;
  --ink: #0b2545;
  --ink-soft: #46617f;
  --line: #cfe2f2;
  --lime: #c9e64b;
  --lime-deep: #a9c62a;
  --lime-ink: #253000;
  --ok: #12804a;
  --ok-bg: #e2f6ea;
  --bad: #c43b2f;
  --bad-bg: #fdecea;
  --sel: #0b5cad;
  --sel-bg: #dceefb;
  --glass: rgba(255, 255, 255, 0.10);
  --glass-line: rgba(255, 255, 255, 0.22);
  --on-dark: #f2f8ff;
  --on-dark-soft: #b9d3ee;
  --font-display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r-lg: 22px;
  --r-md: 14px;
  --r-sm: 10px;
  --shadow: 0 18px 40px -18px rgba(2, 16, 45, 0.55);
  color-scheme: light;
}
:root[data-contrast] {
  --abyss: #000a1c;
  --deep: #00163a;
  --ocean: #00285e;
  --sky: #00285e;
  --ink: #000000;
  --ink-soft: #1c1c1c;
  --line: #000000;
  --ok: #005c2e;
  --bad: #9e1a10;
  --sel: #00285e;
  --sel-bg: #ffe97a;
  --glass: rgba(255, 255, 255, 0.16);
  --glass-line: #ffffff;
  --on-dark: #ffffff;
  --on-dark-soft: #ffffff;
  --lime: #e6ff4d;
}
html { font-size: 100%; }
html[data-big] { font-size: 118.75%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.55;
  color: var(--ink);
  background: var(--abyss);
  background-image:
    radial-gradient(1200px 600px at 85% -10%, rgba(26, 166, 228, 0.45), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, rgba(11, 92, 173, 0.55), transparent 65%),
    linear-gradient(170deg, var(--abyss) 0%, var(--deep) 45%, var(--ocean) 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}
body::after {
  /* VR grid floor */
  content: "";
  position: fixed;
  left: -50%; right: -50%; bottom: -10vh;
  height: 45vh;
  background-image:
    linear-gradient(rgba(140, 210, 255, 0.22) 1px, transparent 1px),
    linear-gradient(90deg, rgba(140, 210, 255, 0.22) 1px, transparent 1px);
  background-size: 64px 64px;
  transform: perspective(420px) rotateX(62deg);
  transform-origin: bottom;
  mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
  pointer-events: none;
  z-index: 0;
}
:root[data-contrast] body::after { display: none; }
#app { position: relative; z-index: 1; }
.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding-inline: 20px; }
.narrow { max-width: 860px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(4, 21, 48, 0.72);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--glass-line);
}
:root[data-contrast] .topbar { background: #000a1c; }
.topbar .wrap { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 10px; }
.brand {
  display: flex; align-items: center; gap: 10px; color: var(--on-dark);
  background: none; border: 0; padding: 4px; cursor: pointer; border-radius: 12px;
}
.brand-mark {
  width: 38px; height: 38px; display: grid; place-items: center;
  background: linear-gradient(140deg, var(--sky), var(--ocean));
  clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%);
}
.brand-mark svg { width: 22px; height: 22px; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; letter-spacing: 0.01em; }
.top-mid { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; justify-content: center; min-width: 0; }
.inv { display: flex; gap: 5px; }
.inv span {
  width: 28px; height: 32px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 1.05rem;
  border-radius: 8px; border: 1px dashed var(--glass-line); color: var(--on-dark-soft);
}
.inv span.got { background: var(--lime); color: var(--lime-ink); border: 1px solid var(--lime); }
.timer {
  font-variant-numeric: tabular-nums; color: var(--on-dark); font-weight: 600;
  display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--glass-line); background: var(--glass); font-size: 0.9rem;
}
.top-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--glass-line); border-radius: 999px; padding: 3px; background: var(--glass); }
.seg button {
  border: 0; background: none; color: var(--on-dark-soft); padding: 4px 11px; border-radius: 999px;
  font-weight: 600; font-size: 0.85rem; letter-spacing: 0.06em; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--glass-line);
  background: var(--glass); color: var(--on-dark); border-radius: 999px; padding: 6px 12px;
  font-size: 0.88rem; font-weight: 500; cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; flex: none; }
.icon-btn:hover { background: rgba(255, 255, 255, 0.18); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 999px; padding: 12px 22px; border: 2px solid transparent;
  font-weight: 600; font-size: 1rem; cursor: pointer; text-decoration: none;
  transition: transform 0.12s ease, background-color 0.15s ease;
}
.btn svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--lime); color: var(--lime-ink); border-color: var(--lime); box-shadow: 0 8px 20px -10px rgba(169, 198, 42, 0.9); }
.btn-primary:hover { background: var(--lime-deep); border-color: var(--lime-deep); }
.btn-blue { background: var(--ocean); color: #fff; }
.btn-blue:hover { background: var(--deep); }
.btn-ghost { background: transparent; color: var(--ocean); border-color: var(--line); }
.btn-ghost:hover { background: var(--ice); }
.btn-light { background: var(--glass); color: var(--on-dark); border-color: var(--glass-line); }
.btn-light:hover { background: rgba(255, 255, 255, 0.2); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- panels ---------- */
main { padding-block: 28px 80px; }
.panel { background: var(--paper); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: clamp(18px, 3.4vw, 32px); }
:root[data-contrast] .panel { border: 2px solid #000; }
.stack { display: grid; gap: 18px; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.76rem; font-weight: 600; color: var(--ink-soft); }
.on-dark .eyebrow, .eyebrow.light { color: var(--on-dark-soft); }
.lead { font-size: 1.08rem; color: var(--ink-soft); max-width: 62ch; }

/* ---------- home ---------- */
.hero { display: grid; gap: 18px; color: var(--on-dark); padding-block: 10px 6px; }
.hero h1 { font-size: clamp(2.4rem, 6.4vw, 4.4rem); font-weight: 800; letter-spacing: -0.01em; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--lime), #7fe0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
:root[data-contrast] .hero h1 em { color: var(--lime); background: none; }
.hero .lead { color: var(--on-dark-soft); font-size: 1.12rem; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.career {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center;
  border-radius: var(--r-md); padding: 16px; background: linear-gradient(135deg, var(--ice), #f5fbff);
  border: 1px solid var(--line);
}
.career .hexicon { width: 64px; height: 64px; display: grid; place-items: center; background: linear-gradient(140deg, var(--sky), var(--ocean)); clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.career .hexicon svg { width: 34px; height: 34px; }
.career h3 { font-size: 1.2rem; color: var(--ocean); }
.field { display: grid; gap: 6px; }
.field label, .label { font-weight: 600; font-size: 0.95rem; }
.input {
  width: 100%; border: 2px solid var(--line); border-radius: var(--r-sm); padding: 11px 14px;
  font: inherit; color: var(--ink); background: #fbfdff;
}
.input:focus { border-color: var(--ocean); outline: none; box-shadow: 0 0 0 3px rgba(11, 92, 173, 0.2); }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.level {
  text-align: left; border: 2px solid var(--line); background: #fbfdff; border-radius: var(--r-md);
  padding: 14px; cursor: pointer; display: grid; gap: 4px;
}
.level strong { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.1; }
.level .age { font-weight: 600; color: var(--ocean); font-size: 0.9rem; }
.level .desc { font-size: 0.88rem; color: var(--ink-soft); }
.level[aria-pressed="true"] { border-color: var(--ocean); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--ocean); }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.switch input { width: 22px; height: 22px; accent-color: var(--ocean); }
.small { font-size: 0.86rem; color: var(--ink-soft); }
.how { display: grid; gap: 10px; counter-reset: how; padding: 0; margin: 0; list-style: none; }
.how li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; }
.how li::before {
  counter-increment: how; content: counter(how);
  width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%;
  background: var(--ice); color: var(--ocean); font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
}
.confirm { border: 2px solid var(--bad); background: var(--bad-bg); border-radius: var(--r-md); padding: 14px; display: grid; gap: 10px; }

/* ---------- map ---------- */
.map-head { color: var(--on-dark); display: grid; gap: 8px; margin-bottom: 26px; }
.map-head h1 { font-size: clamp(2rem, 4.6vw, 3rem); }
.map-head .lead { color: var(--on-dark-soft); }
.hexgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; padding-bottom: 120px; }
.hexcell { position: relative; aspect-ratio: 1 / 0.9; }
.hexcell:nth-child(even) { transform: translateY(52%); }
.hex {
  position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: none; padding: 0;
  cursor: pointer; border-radius: 14px; color: var(--ink);
}
.hex[disabled] { cursor: not-allowed; }
.hex-shape {
  position: absolute; inset: 0;
  clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%);
  background: var(--paper);
  transition: transform 0.18s ease;
}
.hex:hover:not([disabled]) .hex-shape { transform: scale(1.04); }
.hex-shape::after {
  content: ""; position: absolute; inset: 5px;
  clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%);
  background: linear-gradient(160deg, #ffffff, var(--ice));
}
.hex.is-solved .hex-shape { background: var(--lime); }
.hex.is-solved .hex-shape::after { background: linear-gradient(160deg, #f7ffd8, #e3f4a0); }
.hex.is-locked .hex-shape { background: rgba(255, 255, 255, 0.25); }
.hex.is-locked .hex-shape::after { background: linear-gradient(160deg, rgba(10, 44, 107, 0.92), rgba(4, 21, 48, 0.92)); }
.hex.is-door .hex-shape { background: linear-gradient(140deg, var(--sky), var(--lime)); }
.hex.is-door .hex-shape::after { background: linear-gradient(160deg, #0b5cad, #041530); }
.hex-in {
  position: absolute; inset: 14% 18%; display: grid; place-content: center; text-align: center; gap: 2px;
}
.hex-num { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.6vw, 2.3rem); line-height: 1; color: var(--ocean); }
.hex-title { font-weight: 600; font-size: clamp(0.72rem, 1.5vw, 0.92rem); line-height: 1.2; }
.hex-status { font-size: clamp(0.66rem, 1.3vw, 0.78rem); color: var(--ink-soft); }
.hex.is-locked .hex-num, .hex.is-locked .hex-title, .hex.is-locked .hex-status,
.hex.is-door .hex-num, .hex.is-door .hex-title, .hex.is-door .hex-status { color: var(--on-dark); }
.hex.is-door .hex-num { color: var(--lime); }
.hex .lock svg { width: 20px; height: 20px; margin: 0 auto; }
.stars { display: inline-flex; gap: 2px; justify-content: center; }
.stars svg { width: 16px; height: 16px; }
.star-on { color: #e2a400; }
.star-off { color: #c7d5e3; }
.map-foot { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; color: var(--on-dark-soft); }

/* ---------- room ---------- */
.crumb { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--on-dark-soft); font-size: 0.92rem; margin-bottom: 10px; }
.crumb button { background: none; border: 0; color: var(--on-dark); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; font-weight: 500; }
.crumb button svg { width: 18px; height: 18px; }
.room-title { color: var(--on-dark); display: grid; gap: 6px; margin-bottom: 18px; }
.room-title h1 { font-size: clamp(2rem, 5vw, 3.1rem); }
.tabs { display: inline-flex; gap: 6px; padding: 5px; border-radius: 999px; background: var(--glass); border: 1px solid var(--glass-line); margin-bottom: 18px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; color: var(--on-dark); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
.story { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.story p { font-size: 1.06rem; }
.goal { display: flex; gap: 10px; align-items: flex-start; background: var(--ice); border-radius: var(--r-md); padding: 12px 14px; font-size: 0.95rem; }
.goal svg { width: 22px; height: 22px; color: var(--ocean); flex: none; margin-top: 1px; }
.stepper { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper .dot { width: 34px; height: 8px; border-radius: 99px; background: var(--line); }
.stepper .dot.done { background: var(--ok); }
.stepper .dot.now { background: var(--ocean); }
.stepper .lbl { font-size: 0.85rem; color: var(--ink-soft); margin-left: 4px; }
.prompt { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.25rem, 2.6vw, 1.55rem); line-height: 1.2; }
.help { font-size: 0.9rem; color: var(--ink-soft); }
.rules { border: 1px dashed var(--ocean); border-radius: var(--r-sm); padding: 10px 12px; font-size: 0.92rem; color: var(--ocean); background: #f6fbff; }
.quote { font-style: italic; border-left: 4px solid var(--sky); padding: 6px 0 6px 14px; color: var(--ink-soft); }

/* cards used by puzzles */
.cardbtn {
  text-align: left; border: 2px solid var(--line); background: #fbfdff; border-radius: var(--r-md);
  padding: 12px 14px; cursor: pointer; width: 100%; line-height: 1.35; display: flex; gap: 10px; align-items: center;
}
.cardbtn:hover { border-color: #9cc4e6; }
.cardbtn[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-bg); }
.cardbtn.is-ok { border-color: var(--ok); background: var(--ok-bg); }
.cardbtn.is-bad { border-color: var(--bad); background: var(--bad-bg); }
.badge {
  flex: none; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 8px; display: grid; place-items: center;
  font-weight: 700; font-size: 0.9rem; background: var(--ice); color: var(--ocean);
}
.cardbtn[aria-pressed="true"] .badge { background: var(--ocean); color: #fff; }

/* order */
.slots { display: grid; gap: 8px; counter-reset: slot; }
.slot { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; }
.slot .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ocean); color: #fff; font-weight: 700; font-family: var(--font-display); }
.slot .empty { border: 2px dashed var(--line); border-radius: var(--r-md); min-height: 50px; display: grid; align-items: center; padding: 0 14px; color: #9db3c8; font-size: 0.9rem; }
.slot-ends { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; color: var(--ocean); text-transform: uppercase; letter-spacing: 0.08em; }
.pool { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.area-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); }

/* match */
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 16px; align-items: start; }
.match .col { display: grid; gap: 8px; }

/* sort */
.sort { display: grid; gap: 10px; }
.sort-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; background: #fbfdff; }
.sort-row.is-ok { border-color: var(--ok); background: var(--ok-bg); }
.sort-row.is-bad { border-color: var(--bad); background: var(--bad-bg); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
.chip[aria-pressed="true"] { background: var(--ocean); color: #fff; border-color: var(--ocean); }

/* options */
.options { display: grid; gap: 8px; }
.datatable-wrap { overflow-x: auto; }
.datatable { border-collapse: collapse; width: 100%; min-width: 360px; font-variant-numeric: tabular-nums; }
.datatable th, .datatable td { border: 1px solid var(--line); padding: 8px 10px; text-align: center; }
.datatable th { background: var(--ice); font-size: 0.88rem; }
.datatable td:first-child, .datatable th:first-child { text-align: left; font-weight: 600; }
.datatable .x { color: var(--bad); font-weight: 700; }
.datatable .v { color: var(--ok); font-weight: 700; }

/* spot scene */
.scene {
  position: relative; border-radius: var(--r-md); padding: 18px; display: grid; gap: 12px;
  background: linear-gradient(160deg, #0e3b80, #0a2c6b); color: #fff; border: 2px solid #0a2c6b;
}
.scene-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 0.78rem; color: #b9d3ee; letter-spacing: 0.08em; text-transform: uppercase; }
.scene-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 12px; }
.spot {
  border: 2px dashed rgba(255, 255, 255, 0.35); border-radius: 12px; background: rgba(255, 255, 255, 0.07);
  color: #fff; padding: 10px 12px; cursor: pointer; text-align: left; display: grid; gap: 6px; align-content: start;
}
.spot:hover { border-color: #fff; }
.spot.found { border: 3px solid #ff8a7a; background: rgba(255, 120, 100, 0.18); }
.spot.checked { border: 3px solid #8be0a6; }
.spot .tag { justify-self: start; font-size: 0.72rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #ff8a7a; color: #3a0600; }
.spot.checked .tag { background: #8be0a6; color: #00351a; }
.spot-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.spot-long { font-size: 0.95rem; line-height: 1.4; }
.pic { display: grid; place-items: center; height: 92px; border-radius: 10px; background: rgba(255,255,255,0.12); }
.pic svg { width: 56px; height: 56px; }
.faint-btn { justify-self: start; font-size: 0.7rem; color: #4d6e93; background: #31527a; border-radius: 6px; padding: 3px 8px; }
.audio-row { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; }
.audio-row svg { width: 26px; height: 26px; }
.next-cue { justify-self: end; background: var(--lime); color: var(--lime-ink); font-weight: 700; padding: 8px 16px; border-radius: 999px; font-size: 1rem; }
.found-count { font-weight: 600; color: var(--ocean); }

/* reflect */
.reflect { display: grid; gap: 14px; }
textarea.input { min-height: 84px; resize: vertical; }

/* feedback + actions */
.feedback { border-radius: var(--r-md); padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }
.feedback svg { width: 24px; height: 24px; flex: none; }
.feedback.ok { background: var(--ok-bg); color: #0b4f2e; border: 2px solid var(--ok); }
.feedback.bad { background: var(--bad-bg); color: #6d1a12; border: 2px solid var(--bad); }
.feedback.hint { background: #fff8db; color: #5a4300; border: 2px solid #e2b400; }
.feedback.info { background: var(--ice); color: var(--ink); border: 2px solid var(--line); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.actions .btn-row:last-child { margin-left: auto; }

/* room done */
.done-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.letter-tile {
  width: 96px; height: 106px; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 3.4rem; color: var(--lime-ink);
  background: linear-gradient(150deg, #e7ff8a, var(--lime));
  clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%);
  animation: pop 0.6s cubic-bezier(.2, 1.4, .4, 1) both;
}
@keyframes pop { from { transform: scale(0.4) rotate(-12deg); } to { transform: scale(1) rotate(0); } }
.done-head h2 { font-size: clamp(1.6rem, 3.6vw, 2.2rem); color: var(--ocean); }
.debrief { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.debrief div { background: var(--ice); border-radius: var(--r-md); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.debrief strong { font-family: var(--font-display); color: var(--ocean); font-size: 1.05rem; }
.fact { display: flex; gap: 12px; align-items: flex-start; border: 2px solid var(--lime-deep); border-radius: var(--r-md); padding: 12px 14px; background: #fbffe9; }
.fact svg { width: 24px; height: 24px; flex: none; color: #6a7f00; }

/* mission */
.missions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.mission { border: 2px solid var(--line); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px; align-content: start; background: #fbfdff; }
.mission.mine { border-color: var(--ocean); background: #f3f9ff; box-shadow: inset 0 0 0 1px var(--ocean); }
.mission-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 3px 10px; font-size: 0.8rem; font-weight: 600; background: var(--ice); color: var(--ocean); }
.pill.lime { background: var(--lime); color: var(--lime-ink); }
.pill svg { width: 14px; height: 14px; }
.mission h3 { font-size: 1.3rem; }
.mission ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.meta { display: grid; gap: 4px; font-size: 0.9rem; }
.meta b { color: var(--ink); }

/* door */
.door-tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tile {
  width: 62px; height: 70px; border: 0; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: 2rem; color: var(--lime-ink);
  background: var(--lime); clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%);
}
.tile[disabled] { opacity: 0.25; cursor: default; }
.word { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 74px; }
.word span {
  width: 52px; height: 64px; display: grid; place-items: center; border-radius: 12px;
  border: 2px dashed var(--line); font-family: var(--font-display); font-weight: 800; font-size: 1.9rem; color: var(--ocean);
}
.word span.f { border: 2px solid var(--ocean); background: var(--sel-bg); }

/* certificate */
.cert { position: relative; overflow: hidden; text-align: center; display: grid; gap: 14px; justify-items: center; border: 3px solid var(--ocean); }
.cert::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(600px 220px at 50% -20%, rgba(26, 166, 228, 0.22), transparent 70%);
}
.cert h1 { font-size: clamp(2rem, 5vw, 3rem); color: var(--ocean); }
.cert .team { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; }
.cert-word { display: flex; gap: 6px; }
.cert-word span { width: 46px; height: 52px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; color: var(--lime-ink); background: var(--lime); clip-path: polygon(25% 2%, 75% 2%, 100% 50%, 75% 98%, 25% 98%, 0 50%); }
.cert-stats { display: flex; flex-wrap: wrap; gap: 10px 26px; justify-content: center; font-variant-numeric: tabular-nums; }
.cert-stats div { display: grid; }
.cert-stats b { font-family: var(--font-display); font-size: 1.5rem; color: var(--ocean); }
.thoughts { text-align: left; width: 100%; max-width: 640px; display: grid; gap: 10px; }
.thoughts div { background: var(--ice); border-radius: var(--r-md); padding: 10px 14px; }
.thoughts i { color: var(--ink-soft); font-size: 0.9rem; display: block; }

/* teacher */
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tcard { border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.tcard h3 { font-size: 1.15rem; color: var(--ocean); }
.ttable-wrap { overflow-x: auto; }
.ttable { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 0.92rem; }
.ttable th, .ttable td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.ttable th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); }
.ttable td:last-child, .ttable th:last-child { text-align: center; font-variant-numeric: tabular-nums; }

/* overlay (adaptations) */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(2, 10, 26, 0.55); display: grid; place-items: start center; padding: 80px 16px 16px; }
.sheet { width: 100%; max-width: 420px; background: var(--paper); border-radius: var(--r-lg); padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.sheet h2 { font-size: 1.5rem; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 500; box-shadow: var(--shadow); }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .home-grid, .missions, .tgrid { grid-template-columns: 1fr; }
  .debrief { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding-inline: 16px; }
  .topbar { position: relative; top: auto; }
  .hexgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; padding-bottom: 90px; }
  .levels { grid-template-columns: 1fr; }
  .match { grid-template-columns: 1fr 1fr; gap: 8px; }
  .match .cardbtn { font-size: 0.88rem; padding: 10px; }
  .scene-grid { grid-template-columns: 1fr; }
  .sort-row { grid-template-columns: 1fr; }
  .chips { justify-content: flex-start; }
  .top-mid { order: 3; flex-basis: 100%; justify-content: space-between; }
  .brand-name { font-size: 1.1rem; }
  .icon-btn .lbl { display: none; }
  .done-head { grid-template-columns: 1fr; justify-items: start; }
  .story { grid-template-columns: 1fr; }
  .tile { width: 52px; height: 58px; font-size: 1.7rem; }
  .word span { width: 40px; height: 52px; font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  resetDone: ["Progresso apagado.", "Progress deleted."]
};

</script>
<script>
(function () {
  'use strict';
  const KEY = 'xr-health-escape-v1';
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------- icons ---------- */
  const sv = (d, extra) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra || ''}>${d}</svg>`;
  const I = {
    headset: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M4.5 7.5h15a2.5 2.5 0 0 1 2.5 2.5v4.6a2.9 2.9 0 0 1-2.9 2.9h-3.3a2 2 0 0 1-1.7-1l-.9-1.5a1.4 1.4 0 0 0-2.4 0l-.9 1.5a2 2 0 0 1-1.7 1H4.9A2.9 2.9 0 0 1 2 14.6V10a2.5 2.5 0 0 1 2.5-2.5Z"/><circle cx="7.6" cy="12.2" r="1.9" fill="#0b5cad"/><circle cx="16.4" cy="12.2" r="1.9" fill="#0b5cad"/><path fill="#fff" d="M9 5.2h6a1 1 0 0 1 1 1v1.3H8V6.2a1 1 0 0 1 1-1Z"/></svg>`,
    book: sv('<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5A2.5 2.5 0 0 1 4 20.5z"/><path d="M9 7h7M9 10.5h5"/>'),
    aa: sv('<path d="M3 18 7.5 6 12 18M4.6 14h5.8"/><path d="M15 12.5a3 3 0 1 1 0 4.2M21 11v7"/>'),
    speaker: sv('<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>'),
    stopI: sv('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
    bulb: sv('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/>'),
    check: sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    x: sv('<path d="M6 6l12 12M18 6 6 18"/>'),
    info: sv('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
    clock: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    left: sv('<path d="M15 5 8 12l7 7"/>'),
    right: sv('<path d="m9 5 7 7-7 7"/>'),
    target: sv('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'),
    spark: sv('<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/>'),
    lock: sv('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
    door: sv('<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M3 21h18"/><path d="M14.5 12h.01"/>'),
    refresh: sv('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>'),
    map: sv('<path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>'),
    users: sv('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14a6.5 6.5 0 0 1 3.5 6"/>'),
    star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
    soap: '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="26" width="44" height="26" rx="10" fill="#9fd8ff"/><rect x="16" y="31" width="32" height="8" rx="4" fill="#d9f1ff"/><circle cx="24" cy="16" r="6" fill="none" stroke="#d9f1ff" stroke-width="3"/><circle cx="38" cy="12" r="4" fill="none" stroke="#d9f1ff" stroke-width="3"/><circle cx="46" cy="20" r="3" fill="none" stroke="#d9f1ff" stroke-width="3"/></svg>',
    tap: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 22h26a8 8 0 0 1 8 8v6h-8v-4H10z" fill="#9fd8ff"/><rect x="18" y="12" width="10" height="10" rx="2" fill="#d9f1ff"/><path d="M40 44c0 4 4 6 4 10a4 4 0 0 1-8 0c0-4 4-6 4-10z" fill="#5fc4ff"/></svg>',
    audio: '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#ffffff22"/><path d="M12 10.5v11l9-5.5z" fill="#fff"/></svg>'
  };

  /* ---------- state ---------- */
  let state;
  const ui = { tab: 'puzzle', pIndex: 0, work: null, fb: null, solvedNow: false, showDone: false, overlay: false, confirm: null, door: [], speaking: false, toast: '' };
  const canSpeak = typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined';

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function shuffled(n) {
    const base = Array.from({ length: n }, (_, k) => k);
    if (n < 2) return base;
    let s; let guard = 0;
    do { s = shuffle(base); guard++; } while (s.every((v, k) => v === k) && guard < 20);
    return s;
  }
  function fresh(prev) {
    return {
      v: 1, lang: prev ? prev.lang : 'pt', big: prev ? prev.big : false, contrast: prev ? prev.contrast : false,
      level: 'explorer', team: '', timerOn: false, elapsed: 0, started: false, finished: false, finishedAt: null,
      unlockAll: prev ? prev.unlockAll : false, screen: 'home', back: 'home', room: 0,
      rooms: ROOMS.map(() => ({ solved: false, done: [], mistake: false, hint: false })),
      slots: shuffled(ROOMS.length), reflections: {}
    };
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.v === 1 && Array.isArray(s.rooms) && s.rooms.length === ROOMS.length) return s;
    } catch (e) { /* storage unavailable */ }
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } }

  const T = x => Array.isArray(x) ? (state.lang === 'pt' ? x[0] : x[1]) : x;
  const S = k => T(STR[k]);
  const isS = () => state.level === 'specialist';
  const lvOK = it => !it.lv || (it.lv === 's' ? isS() : !isS());
  const puzzlesOf = R => R.puzzles.filter(lvOK);
  const unlocked = i => state.unlockAll || i === 0 || state.rooms[i - 1].solved;
  const allSolved = () => state.rooms.every(r => r.solved);
  const starsOf = i => { const r = state.rooms[i]; return Math.max(1, 3 - (r.mistake ? 1 : 0) - (r.hint ? 1 : 0)); };
  const totalStars = () => state.rooms.reduce((n, r, i) => n + (r.solved ? starsOf(i) : 0), 0);
  const fmtTime = ms => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
  const starRow = n => `<span class="stars" aria-label="${n} / 3">${[0, 1, 2].map(k => `<span class="${k < n ? 'star-on' : 'star-off'}">${I.star}</span>`).join('')}</span>`;
  const levelName = () => isS() ? `${S('specialist')} · ${S('specialistAge')}` : `${S('explorer')} · ${S('explorerAge')}`;

  /* ---------- puzzle work ---------- */
  function initWork(p) {
    if (!p) return null;
    switch (p.type) {
      case 'order': return { pool: shuffled(p.items.filter(lvOK).length), placed: [], marks: null };
      case 'match': return { right: shuffled(p.pairs.filter(lvOK).length), sel: null, pairs: {}, marks: null };
      case 'sort': return { order: shuffle(p.items.map((_, k) => k).filter(k => lvOK(p.items[k]))), ans: {}, marks: null };
      case 'choice': return { order: shuffle(p.options.map((_, k) => k).filter(k => lvOK(p.options[k]))), pick: null, marks: null };
      case 'multi': return { order: shuffle(p.options.map((_, k) => k).filter(k => lvOK(p.options[k]))), picks: [], marks: null };
      case 'spot': return { found: [], ok: [] };
      default: return {};
    }
  }
  function enterRoom(i) {
    const rs = state.rooms[i];
    const P = puzzlesOf(ROOMS[i]);
    let k = 0;
    while (k < P.length && rs.done.indexOf(k) !== -1) k++;
    ui.pIndex = Math.min(k, P.length - 1);
    ui.work = initWork(P[ui.pIndex]);
    ui.fb = null; ui.solvedNow = false; ui.showDone = rs.solved; ui.tab = 'puzzle';
  }
  function current() { const R = ROOMS[state.room]; return { R, rs: state.rooms[state.room], P: puzzlesOf(R) }; }

  /* ---------- render helpers ---------- */
  function topbar() {
    const inv = state.slots.map(ri => {
      const got = state.rooms[ri].solved;
      return `<span class="${got ? 'got' : ''}">${got ? esc(T(ROOMS[ri].letter)) : '·'}</span>`;
    }).join('');
    const timer = state.timerOn && state.started ? `<span class="timer" title="${esc(S('timeLabel'))}">${I.clock}<span id="timer">${fmtTime(state.elapsed)}</span></span>` : '';
    return `<div class="wrap">
      <button class="brand" data-act="home" aria-label="${esc(S('home'))}"><span class="brand-mark">${I.headset}</span><span class="brand-name">${esc(S('brand'))}</span></button>
      <div class="top-mid">${state.started ? `<div class="inv" role="img" aria-label="${esc(S('letters'))}">${inv}</div>` : ''}${timer}</div>
      <div class="top-right">
        <div class="seg" role="group" aria-label="${esc(S('lang'))}">
          <button data-act="lang" data-v="pt" aria-pressed="${state.lang === 'pt'}" lang="pt-PT">PT</button>
          <button data-act="lang" data-v="en" aria-pressed="${state.lang === 'en'}" lang="en-GB">EN</button>
        </div>
        <button class="icon-btn" data-act="overlay" aria-haspopup="dialog">${I.aa}<span class="lbl">${esc(S('settings'))}</span></button>
        <button class="icon-btn" data-act="teacher">${I.book}<span class="lbl">${esc(S('teacher'))}</span></button>
      </div></div>`;
  }
  function speakBtn(id) {
    if (!canSpeak) return '';
    return `<button class="btn btn-ghost" data-act="speak" data-v="${id}">${ui.speaking ? I.stopI : I.speaker}${esc(ui.speaking ? S('stop') : S('listen'))}</button>`;
  }
  function feedback() {
    if (!ui.fb) return '<div class="sr" role="status" aria-live="polite"></div>';
    const icon = { ok: I.check, bad: I.x, hint: I.bulb, info: I.info }[ui.fb.kind];
    return `<div class="feedback ${ui.fb.kind}" role="status" aria-live="polite">${icon}<div>${ui.fb.html}</div></div>`;
  }

  /* ---------- screens ---------- */
  function screenHome() {
    const titleHTML = state.lang === 'pt' ? 'Missão <em>XR</em> Saúde' : '<em>XR</em> Health Mission';
    const started = state.started;
    const lvBtn = (v, n, a, d) => `<button class="level" data-act="level" data-v="${v}" aria-pressed="${state.level === v}" ${started ? 'disabled aria-disabled="true"' : ''}><strong>${esc(S(n))}</strong><span class="age">${esc(S(a))}</span><span class="desc">${esc(S(d))}</span></button>`;
    const confirm = ui.confirm === 'new' ? `<div class="confirm" role="alertdialog" aria-live="assertive"><p>${esc(S('newGameConfirm'))}</p><div class="btn-row"><button class="btn btn-blue" data-act="confirmNew">${esc(S('yes'))}</button><button class="btn btn-ghost" data-act="confirmNo">${esc(S('no'))}</button></div></div>` : '';
    const buttons = started
      ? `<div class="btn-row"><button class="btn btn-primary" data-act="cont">${esc(S('cont'))}${I.right}</button><button class="btn btn-ghost" data-act="askNew">${I.refresh}${esc(S('newGame'))}</button></div>${confirm}`
      : `<div class="btn-row"><button class="btn btn-primary" data-act="start">${esc(S('start'))}${I.right}</button></div>`;
    return `<div class="wrap">
      <section class="hero">
        <p class="eyebrow light">${esc(S('eyebrow'))}</p>
        <h1 id="h">${titleHTML}</h1>
        <p class="lead">${esc(S('homeLead'))}</p>
        <div class="btn-row">${canSpeak ? `<button class="btn btn-light" data-act="speak" data-v="home">${ui.speaking ? I.stopI : I.speaker}${esc(ui.speaking ? S('stop') : S('listen'))}</button>` : ''}</div>
      </section>
      <div class="home-grid" style="margin-top:22px">
        <section class="panel stack">
          <div class="career"><span class="hexicon">${I.headset}</span><div><p class="eyebrow">${esc(S('careerTitle'))}</p><h3>${esc(S('careerName'))}</h3><p class="small">${esc(S('careerText'))}</p></div></div>
          <div class="field"><label for="team">${esc(S('teamLabel'))}</label><input class="input" id="team" maxlength="40" autocomplete="off" placeholder="${esc(S('teamPh'))}" value="${esc(state.team)}"></div>
          <div class="field"><span class="label">${esc(S('levelLabel'))}</span><div class="levels">${lvBtn('explorer', 'explorer', 'explorerAge', 'explorerDesc')}${lvBtn('specialist', 'specialist', 'specialistAge', 'specialistDesc')}</div>${started ? `<p class="small">${esc(S('levelLocked'))}</p>` : ''}</div>
          <label class="switch" for="timerOn"><input type="checkbox" id="timerOn" ${state.timerOn ? 'checked' : ''}><span><span class="label">${esc(S('timerLabel'))}</span><br><span class="small">${esc(S('timerNote'))}</span></span></label>
          ${buttons}
        </section>
        <section class="panel stack">
          <h2 style="font-size:1.6rem">${esc(S('howTitle'))}</h2>
          <ol class="how">${STR.how.map(h => `<li><span>${esc(T(h))}</span></li>`).join('')}</ol>
          <div class="goal">${I.star}<span>${esc(S('stars3'))} ${esc(S('hintCost'))}</span></div>
          <button class="btn btn-ghost" data-act="teacher">${I.book}${esc(S('teacher'))}</button>
        </section>
      </div></div>`;
  }

  function screenMap() {
    const cells = ROOMS.map((R, i) => {
      const rs = state.rooms[i];
      const open = unlocked(i);
      const cls = rs.solved ? 'is-solved' : (open ? '' : 'is-locked');
      const status = rs.solved ? starRow(starsOf(i)) : (open ? esc(S('open')) : `<span class="lock">${I.lock}</span>`);
      const statusTxt = rs.solved ? S('solved') : (open ? S('open') : S('locked'));
      return `<div class="hexcell"><button class="hex ${cls}" data-act="room" data-i="${i}" ${open ? '' : 'disabled'} aria-label="${esc(`${S('room')} ${i + 1}: ${T(R.title)} — ${statusTxt}`)}">
        <span class="hex-shape"></span><span class="hex-in"><span class="hex-num">${i + 1}</span><span class="hex-title">${esc(T(R.title))}</span><span class="hex-status">${status}</span></span></button></div>`;
    }).join('');
    const ready = allSolved();
    const door = `<div class="hexcell"><button class="hex is-door" data-act="door" ${ready ? '' : 'disabled'} aria-label="${esc(S('door'))}">
      <span class="hex-shape"></span><span class="hex-in"><span class="hex-num">${I.door.replace('aria-hidden="true"', 'aria-hidden="true" style="width:34px;height:34px;margin:0 auto"')}</span><span class="hex-title">${esc(S('door'))}</span><span class="hex-status">${esc(ready ? '' : S('doorLocked'))}</span></span></button></div>`;
    const solved = state.rooms.filter(r => r.solved).length;
    return `<div class="wrap">
      <div class="map-head"><p class="eyebrow light">${esc(state.team || S('noTeam'))} · ${esc(levelName())}</p><h1 id="h">${esc(S('map'))}</h1><p class="lead">${esc(S('mapLead'))}</p></div>
      <div class="hexgrid">${cells}${door}</div>
      <div class="map-foot"><span>${solved} / 7 · ${totalStars()} / 21 ${esc(S('starsLabel').toLowerCase())}</span><button class="btn btn-light" data-act="teacher">${I.book}${esc(S('teacher'))}</button></div>
    </div>`;
  }

  function missionCard(R, key) {
    const m = R.mission[key];
    const mine = (key === 's') === isS();
    const who = key === 's' ? `${S('specialistAge')} · ${S('specialist')}` : `${S('explorerAge')} · ${S('explorer')}`;
    return `<article class="mission ${mine ? 'mine' : ''}">
      <div class="mission-top"><span class="pill">${I.users}${esc(who)}</span><span class="pill">${I.clock}${m.min} min</span></div>
      ${mine ? `<span class="pill lime" style="justify-self:start">${esc(S('yourLevel'))}</span>` : ''}
      <h3>${esc(T(m.title))}</h3>
      <ol>${m.steps.map(s => `<li>${esc(T(s))}</li>`).join('')}</ol>
      <div class="meta"><span><b>${esc(S('materials'))}:</b> ${esc(T(m.materials))}</span><span><b>${esc(S('deliver'))}:</b> ${esc(T(m.deliver))}</span></div>
    </article>`;
  }

  function puzzleBody(p, w) {
    if (p.type === 'order') {
      const items = p.items.filter(lvOK);
      const n = items.length;
      const slots = Array.from({ length: n }, (_, k) => {
        const v = w.placed[k];
        if (v == null) return `<div class="slot"><span class="n">${k + 1}</span><div class="empty">${k === w.placed.length ? '…' : ''}</div></div>`;
        const mk = w.marks ? (w.marks[k] ? 'is-ok' : 'is-bad') : '';
        return `<div class="slot"><span class="n">${k + 1}</span><button class="cardbtn ${mk}" data-act="oslot" data-k="${k}">${esc(T(items[v].t))}</button></div>`;
      }).join('');
      const pool = w.pool.filter(v => w.placed.indexOf(v) === -1)
        .map(v => `<button class="cardbtn" data-act="opick" data-k="${v}">${esc(T(items[v].t))}</button>`).join('');
      const ends = p.slotLabels ? `<div class="slot-ends"><span>↑ ${esc(T(p.slotLabels[0]))}</span><span>${esc(T(p.slotLabels[1]))} ↓</span></div>` : '';
      return `<div class="stack" style="gap:12px">${ends}<div class="slots">${slots}</div>${pool ? `<p class="area-label">${state.lang === 'pt' ? 'Cartões' : 'Cards'}</p><div class="pool">${pool}</div>` : ''}</div>`;
    }
    if (p.type === 'match') {
      const pairs = p.pairs.filter(lvOK);
      const L = 'ABCDEFG';
      const rightOwner = {};
      Object.keys(w.pairs).forEach(a => { rightOwner[w.pairs[a]] = +a; });
      const left = pairs.map((pr, k) => {
        const mk = w.marks ? (w.marks[k] ? 'is-ok' : 'is-bad') : '';
        return `<button class="cardbtn ${mk}" data-act="mleft" data-k="${k}" aria-pressed="${w.sel === k}"><span class="badge">${L[k]}</span><span>${esc(T(pr.a))}</span></button>`;
      }).join('');
      const right = w.right.map(r => {
        const owner = rightOwner[r];
        const has = owner != null;
        const mk = w.marks && has ? (w.marks[owner] ? 'is-ok' : 'is-bad') : '';
        return `<button class="cardbtn ${mk}" data-act="mright" data-k="${r}" aria-pressed="${has}"><span class="badge">${has ? L[owner] : '?'}</span><span>${esc(T(pairs[r].b))}</span></button>`;
      }).join('');
      return `<div class="match"><div class="col">${left}</div><div class="col">${right}</div></div>`;
    }
    if (p.type === 'sort') {
      return `<div class="sort">${w.order.map(k => {
        const it = p.items[k];
        const mk = w.marks ? (w.marks[k] ? 'is-ok' : 'is-bad') : '';
        const chips = p.bins.map((b, bi) => `<button class="chip" data-act="sbin" data-k="${k}" data-b="${bi}" aria-pressed="${w.ans[k] === bi}">${esc(T(b))}</button>`).join('');
        return `<div class="sort-row ${mk}"><span>${esc(T(it.t))}</span><div class="chips" role="group">${chips}</div></div>`;
      }).join('')}</div>`;
    }
    if (p.type === 'choice' || p.type === 'multi') {
      const multi = p.type === 'multi';
      return `<div class="options">${w.order.map(k => {
        const o = p.options[k];
        const on = multi ? w.picks.indexOf(k) !== -1 : w.pick === k;
        const mk = w.marks && w.marks[k] != null ? (w.marks[k] ? 'is-ok' : 'is-bad') : '';
        return `<button class="cardbtn ${mk}" data-act="${multi ? 'mpick' : 'cpick'}" data-k="${k}" aria-pressed="${on}"><span class="badge">${on ? '✓' : ''}</span><span>${esc(T(o.t))}</span></button>`;
      }).join('')}</div>`;
    }
    if (p.type === 'spot') {
      const st = id => {
        const found = w.found.indexOf(id) !== -1, ok = w.ok.indexOf(id) !== -1;
        return { cls: found ? 'found' : (ok ? 'checked' : ''), tag: found ? `<span class="tag">${state.lang === 'pt' ? 'Problema' : 'Problem'}</span>` : (ok ? `<span class="tag">${state.lang === 'pt' ? 'Está bem' : 'Fine'}</span>` : '') };
      };
      const b = (id, inner, label) => { const s = st(id); return `<button class="spot ${s.cls}" data-act="spot" data-id="${id}" aria-label="${esc(label)}">${s.tag}${inner}</button>`; };
      const pt = state.lang === 'pt';
      const audio = isS() ? b('audio', `<span class="audio-row">${I.audio}<span>${pt ? 'Áudio da enfermeira · 0:42' : 'Nurse’s audio · 0:42'}</span></span>`, pt ? 'Áudio da enfermeira' : 'Nurse’s audio') : '';
      return `<div class="scene" role="group" aria-label="${pt ? 'Cena para rever' : 'Scene to check'}">
        <div class="scene-top"><span>FrameVR.io · ${pt ? 'Cena 2' : 'Scene 2'}</span><span>v1</span></div>
        ${b('title', `<span class="spot-title">${pt ? 'Lava as mãos' : 'Wash your hands'}</span>`, pt ? 'Título' : 'Title')}
        <div class="scene-grid">

  function helpText(p) {
    return { order: S('orderHelp'), match: S('matchHelp'), sort: S('sortHelp'), choice: S('choiceHelp'), multi: S('multiHelp'), spot: S('spotHelp'), reflect: S('reflectHelp') }[p.type];

  function extras(p) {
    let h = '';
    if (p.rules) h += `<p class="rules">${esc(T(p.rules))}</p>`;

        <h2 style="font-size:1.4rem">${esc(T(TEACHER.tableTitle))}</h2>
        <div class="ttable-wrap"><table class="ttable"><thead><tr><th>${esc(T(TEACHER.thRoom))}</th><th>${esc(T(TEACHER.thSession))}</th><th>${esc(T(TEACHER.thWs))}</th><th>${esc(T(TEACHER.thPuzzles))}</th></tr></thead><tbody>${rows}</tbody></table></div>

  function overlay() {
    if (!ui.overlay) return '';
    return `<div class="overlay" data-act="overlayBg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovt">
      <h2 id="ovt">${esc(S('settings'))}</h2>
      <p class="small">${esc(S('settingsNote'))}</p>
      <label class="switch" for="optBig"><input type="checkbox" id="optBig" ${state.big ? 'checked' : ''}><span class="label">${esc(S('bigText'))}</span></label>
      <label class="switch" for="optContrast"><input type="checkbox" id="optContrast" ${state.contrast ? 'checked' : ''}><span class="label">${esc(S('contrast'))}</span></label>
      <div class="btn-row"><button class="btn btn-primary" data-act="overlay">${esc(S('close'))}</button></div>
    </div></div>`;
  }

  const SCREENS = { home: screenHome, map: screenMap, room: screenRoom, door: screenDoor, end: screenEnd, teacher: screenTeacher };

  function render(opts) {
    const root = document.documentElement;
    root.lang = state.lang === 'pt' ? 'pt-PT' : 'en-GB';
    if (state.big) root.setAttribute('data-big', ''); else root.removeAttribute('data-big');
    if (state.contrast) root.setAttribute('data-contrast', ''); else root.removeAttribute('data-contrast');
    document.title = S('brand');
    // remember focus
    const a = document.activeElement;
    let sel = null;
    if (a && a.dataset && a.dataset.act) {
      sel = `[data-act="${a.dataset.act}"]` + ['k', 'v', 'i', 'b', 'id'].map(x => a.dataset[x] != null ? `[data-${x}="${a.dataset[x]}"]` : '').join('');
    } else if (a && a.id) sel = '#' + a.id;
    $('#top').innerHTML = topbar();
    $('#main').innerHTML = (SCREENS[state.screen] || screenHome)();
    $('#ov').innerHTML = overlay();
    $('#toast').innerHTML = ui.toast ? `<div class="toast" role="status">${esc(ui.toast)}</div>` : '';
    if (opts && opts.top) { window.scrollTo(0, 0); const h = $('#h'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }
    else if (ui.overlay) { const c = $('#optBig'); if (c && !sel) c.focus(); }
    else if (sel) { try { const el = $(sel); if (el && !el.disabled) el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  }
  function go(screen) { stopSpeak(); state.screen = screen; ui.fb = null; ui.confirm = null; save(); render({ top: true }); }
  function toast(msg) { ui.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { ui.toast = ''; const t = $('#toast'); if (t) t.innerHTML = ''; }, 2200); }

  /* ---------- speech ---------- */
  function stopSpeak() { if (canSpeak) { try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } } ui.speaking = false; }
  function speak(text) {
    if (!canSpeak) return;
    if (ui.speaking) { stopSpeak(); render(); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      const lang = state.lang === 'pt' ? 'pt-PT' : 'en-GB';
      u.lang = lang; u.rate = 0.95;
      const voices = window.speechSynthesis.getVoices() || [];
      const v = voices.find(x => x.lang === lang) || voices.find(x => x.lang && x.lang.slice(0, 2) === lang.slice(0, 2));
      if (v) u.voice = v;
      u.onend = u.onerror = () => { ui.speaking = false; render(); };
      ui.speaking = true;
      window.speechSynthesis.speak(u);
      render();
    } catch (e) { ui.speaking = false; }
  }

  /* ---------- checking ---------- */
  function solve(msg) {
    const { rs, P } = current();
    if (rs.done.indexOf(ui.pIndex) === -1) rs.done.push(ui.pIndex);
    if (rs.done.length >= P.length) rs.solved = true;
    ui.solvedNow = true;
    ui.fb = { kind: 'ok', html: `<b>${state.lang === 'pt' ? 'Certo!' : 'Correct!'}</b> ${esc(msg)}` };
    save();
  }
  function wrong(extra) {
    current().rs.mistake = true;
    ui.fb = { kind: 'bad', html: esc(extra || S('tryAgain')) };
    save();
  }
  function check() {
    const { P } = current();
    const p = P[ui.pIndex], w = ui.work;
    const notDone = () => { ui.fb = { kind: 'info', html: esc(S('notFinished')) }; };
    if (p.type === 'order') {
      const n = p.items.filter(lvOK).length;
      if (w.placed.length < n) return notDone();
      w.marks = w.placed.map((v, k) => v === k);
      if (w.marks.every(Boolean)) return solve(T(p.success));
      return wrong(`${S('tryAgain')} ${S('orderGreen')}`);
    }
    if (p.type === 'match') {
      const n = p.pairs.filter(lvOK).length;
      if (Object.keys(w.pairs).length < n) return notDone();
      w.marks = Array.from({ length: n }, (_, k) => w.pairs[k] === k);
      if (w.marks.every(Boolean)) return solve(T(p.success));
      return wrong(`${S('tryAgain')} ${S('matchWrong')}`);
    }
    if (p.type === 'sort') {
      if (w.order.some(k => w.ans[k] == null)) return notDone();
      w.marks = {};
      w.order.forEach(k => { w.marks[k] = w.ans[k] === p.items[k].bin; });
      if (w.order.every(k => w.marks[k])) return solve(T(p.success));
      return wrong(`${S('tryAgain')} ${S('sortWrong')}`);
    }
    if (p.type === 'choice') {
      if (w.pick == null) { ui.fb = { kind: 'info', html: esc(S('choiceHelp')) }; return; }
      const o = p.options[w.pick];
      w.marks = {}; w.marks[w.pick] = !!o.ok;
      if (o.ok) return solve(T(p.success));
      return wrong(o.fb ? `${T(o.fb)}` : S('tryAgain'));
    }
    if (p.type === 'multi') {
      if (!w.picks.length) { ui.fb = { kind: 'info', html: esc(S('multiHelp')) }; return; }
      const good = w.order.filter(k => p.options[k].ok);
      const ok = good.length === w.picks.length && good.every(k => w.picks.indexOf(k) !== -1);
      w.marks = {};
      w.picks.forEach(k => { w.marks[k] = !!p.options[k].ok; });
      if (ok) return solve(T(p.success));
      const missing = good.some(k => w.picks.indexOf(k) === -1);
      return wrong(`${S('tryAgain')} ${missing ? (state.lang === 'pt' ? 'Ainda falta pelo menos uma resposta certa.' : 'At least one correct answer is still missing.') : ''}`);
    }
    if (p.type === 'reflect') {
      const need = p.prompts.map((q, k) => lvOK(q) ? k : -1).filter(k => k >= 0);
      if (need.some(k => !state.reflections[k] || state.reflections[k].trim().length < 2)) { ui.fb = { kind: 'info', html: esc(S('reflectEmpty')) }; return; }
      return solve(T(p.success));
    }
  }

  /* ---------- actions ---------- */
  const ACT = {
    home() { go('home'); },
    lang(el) { stopSpeak(); state.lang = el.dataset.v; save(); render(); },
    overlay() { ui.overlay = !ui.overlay; render(); },
    overlayBg(el, e) { if (e.target === el) { ui.overlay = false; render(); } },
    teacher() { if (state.screen !== 'teacher') state.back = state.screen; go('teacher'); },
    back() { go(state.back && state.back !== 'teacher' ? state.back : 'home'); },
    level(el) { if (state.started) return; state.level = el.dataset.v; save(); render(); },
    start() { state.started = true; save(); go('map'); },
    cont() { go('map'); },
    askNew() { ui.confirm = 'new'; render(); },
    confirmNo() { ui.confirm = null; render(); },
    confirmNew() { state = fresh(state); ui.confirm = null; save(); render({ top: true }); },
    askReset() { ui.confirm = 'reset'; render(); },
    resetYes() { state = fresh(state); state.screen = 'teacher'; ui.confirm = null; save(); toast(T(TEACHER.resetDone)); },
    playAgain() { state = fresh(state); save(); render({ top: true }); },
    map() { go('map'); },
    room(el) { const i = +el.dataset.i; if (!unlocked(i)) return; state.room = i; enterRoom(i); go('room'); },
    nextRoom() { const i = state.room + 1; if (i < ROOMS.length && unlocked(i)) { state.room = i; enterRoom(i); go('room'); } else go('map'); },
    door() { ui.door = []; go('door'); },
    tab(el) { stopSpeak(); ui.tab = el.dataset.v; render({ top: true }); },
    speak(el) {
      if (el.dataset.v === 'home') return speak(S('homeLead'));
      const { R, P } = current();
      const p = P[ui.pIndex];
      speak(`${T(R.intro)} ${p ? T(p.prompt) + ' ' + helpText(p) : ''}`);
    },
    hint() {
      const { rs, P } = current();
      rs.hint = true; save();
      ui.fb = { kind: 'hint', html: `<b>${esc(S('hint'))}:</b> ${esc(T(P[ui.pIndex].hint))}` };
      render();
    },
    reset() { const { P } = current(); ui.work = initWork(P[ui.pIndex]); ui.fb = null; render(); },
    check() { check(); render(); },
    nextPuzzle() {
      const { rs, P } = current();
      ui.solvedNow = false; ui.fb = null;
      if (rs.solved) { ui.showDone = true; render({ top: true }); return; }
      let k = ui.pIndex + 1;
      while (k < P.length && rs.done.indexOf(k) !== -1) k++;
      if (k >= P.length) { k = 0; while (k < P.length && rs.done.indexOf(k) !== -1) k++; }
      ui.pIndex = k; ui.work = initWork(P[k]);
      render();
      const pz = $('#pz'); if (pz) { pz.setAttribute('tabindex', '-1'); pz.focus({ preventScroll: false }); }
    },
    opick(el) { const w = ui.work; const v = +el.dataset.k; if (w.placed.indexOf(v) === -1) w.placed.push(v); w.marks = null; ui.fb = null; render(); },
    oslot(el) { const w = ui.work; w.placed.splice(+el.dataset.k, 1); w.marks = null; ui.fb = null; render(); },
    mleft(el) { const w = ui.work; const k = +el.dataset.k; w.sel = w.sel === k ? null : k; render(); },
    mright(el) {
      const w = ui.work; const r = +el.dataset.k;
      const owner = Object.keys(w.pairs).find(a => w.pairs[a] === r);
      if (w.sel == null) { if (owner != null) { delete w.pairs[owner]; w.marks = null; } render(); return; }
      if (owner != null) delete w.pairs[owner];
      w.pairs[w.sel] = r; w.sel = null; w.marks = null; ui.fb = null;
      const n = current().P[ui.pIndex].pairs.filter(lvOK).length;
      for (let k = 0; k < n; k++) { if (w.pairs[k] == null) { w.sel = k; break; } }
      render();
    },
    sbin(el) { const w = ui.work; w.ans[+el.dataset.k] = +el.dataset.b; w.marks = null; ui.fb = null; render(); },
    cpick(el) { const w = ui.work; w.pick = +el.dataset.k; w.marks = null; ui.fb = null; render(); },
    mpick(el) { const w = ui.work; const k = +el.dataset.k; const at = w.picks.indexOf(k); if (at === -1) w.picks.push(k); else w.picks.splice(at, 1); w.marks = null; ui.fb = null; render(); },
    spot(el) {
      const w = ui.work; const id = el.dataset.id;
      const item = SPOT.find(s => s.id === id);
      if (!item) return;
      if (item.bad) { if (w.found.indexOf(id) === -1) w.found.push(id); ui.fb = { kind: 'bad', html: `<b>${state.lang === 'pt' ? 'Problema encontrado!' : 'Problem found!'}</b> ${esc(T(item.fb))}` }; }
      else { if (w.ok.indexOf(id) === -1) w.ok.push(id); ui.fb = { kind: 'info', html: esc(T(item.fb)) }; }
      const need = SPOT.filter(lvOK).filter(s => s.bad).length;
      if (w.found.length >= need) solve(T(current().P[ui.pIndex].success));
      render();
    },
    dtile(el) { const k = +el.dataset.k; if (ui.door.indexOf(k) === -1 && ui.door.length < T(WORD).length) ui.door.push(k); ui.fb = null; render(); },
    dclear() { ui.door = []; ui.fb = null; render(); },
    dhint() { ui.fb = { kind: 'hint', html: `<b>${esc(S('hint'))}:</b> ${esc(S('doorHint'))}` }; render(); },
    dopen() {
      const letters = state.slots.map(ri => T(ROOMS[ri].letter));
      const word = ui.door.map(k => letters[k]).join('');
      if (word === T(WORD)) { state.finished = true; state.finishedAt = Date.now(); save(); go('end'); return; }
      ui.fb = { kind: 'bad', html: esc(ui.door.length < T(WORD).length ? S('notFinished') : S('doorWrong')) };
      render();
    }
  };

  /* ---------- events ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.overlay) { ui.overlay = false; render(); } });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'team') { state.team = el.value.slice(0, 40); save(); }
    else if (el.dataset && el.dataset.refl != null) { state.reflections[el.dataset.refl] = el.value.slice(0, 300); save(); }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.id === 'timerOn') { state.timerOn = el.checked; save(); render(); }
    else if (el.id === 'unlockAll') { state.unlockAll = el.checked; save(); render(); }
    else if (el.id === 'optBig') { state.big = el.checked; save(); render(); }
    else if (el.id === 'optContrast') { state.contrast = el.checked; save(); render(); }
  });
  let ticks = 0;
  setInterval(() => {
    if (!state || !state.timerOn || !state.started || state.finished) return;
    if (state.screen === 'home' || state.screen === 'teacher') return;
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    state.elapsed += 1000;
    const t = document.getElementById('timer');
    if (t) t.textContent = fmtTime(state.elapsed);
    if (++ticks % 5 === 0) save();
  }, 1000);

  /* ---------- boot ---------- */
  function boot(data) {
    const snap = data && data.state;
    state = (snap && snap.v === 1) ? snap : (load() || fresh());
    if (data && data.ui) Object.assign(ui, data.ui, { speaking: false, overlay: false });
    if (state.screen === 'room') { if (!ui.work) enterRoom(state.room); }
    if (state.screen === 'end' && !state.finished) state.screen = 'map';
    render();
  }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state, ui })); } catch (e) { /* ignore */ }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
</body>
</html>
